<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Patient Journey — Live Scoreboard</title>
  <link rel="stylesheet" href="css/style.css?v=20260916b">
  <link rel="stylesheet" href="css/host.css?v=20260916b">
  <style>
    .leaderboard-row.role-row{grid-template-columns:60px 1.3fr 150px 1.4fr 120px}
    .role-participants{display:flex;flex-direction:column;text-align:center;color:var(--text-secondary)}
    .role-participants strong{font-size:28px;color:var(--heading)}
    .role-participants span{font-size:12px}
    .role-average{text-align:center;font-size:26px;font-weight:800;color:var(--accent-success)}
    .join-panel-text button{margin-top:10px}
    @media(max-width:900px){.leaderboard-row.role-row{grid-template-columns:1fr}.role-average{font-size:22px}}
  </style>
</head>
<body class="host-body">
  <div class="host-header">
    <h1>🏥 Safe Patient Journey — Live Scoreboard</h1>
    <span class="host-live-badge"><span class="host-live-dot"></span>LIVE</span>
  </div>

  <div class="join-panel" id="joinPanel">
    <canvas id="joinQrCode"></canvas>
    <div class="join-panel-text">
      <h2>📱 Scan to Join This Session</h2>
      <p>Session: <strong id="sessionIdText">—</strong></p>
      <p id="joinUrlText">Loading link…</p>
      <button type="button" onclick="startNewSession()">🔄 Start New Session</button>
    </div>
  </div>

  <div class="leaderboard" id="leaderboard">
    <div class="leaderboard-empty">Waiting for players to join…</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=20260916b"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1/build/qrcode.min.js"></script>
  <script src="js/host.js?v=20260916b"></script>
</body>
</html>
